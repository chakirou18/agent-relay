<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Relay</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 64px; }
    .hero { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    h1, h2, p { margin: 0; } h1 { color: #12213f; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: -.04em; line-height: 1; }
    h2 { color: #17233b; font-size: 1.05rem; letter-spacing: -.01em; } .eyebrow { color: #4774c8; font-size: .74rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 10px; }
    .muted { color: #71809a; font-size: .92rem; margin-top: 12px; } .card { background: #fff; border: 1px solid #e3e9f2; border-radius: 16px; box-shadow: 0 8px 24px #2946740d; }
    .auth { padding: 20px; display: flex; align-items: end; gap: 12px; margin-bottom: 24px; } .field { flex: 1; min-width: 0; } label { display: block; color: #4e5d76; font-size: .78rem; font-weight: 700; margin-bottom: 7px; }
    input { width: 100%; border: 1px solid #cbd5e4; border-radius: 9px; background: #fbfcfe; color: #172033; font: inherit; padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
    input:focus { border-color: #5d86d6; box-shadow: 0 0 0 3px #5d86d622; } button { border: 0; border-radius: 9px; cursor: pointer; font: inherit; font-weight: 700; padding: 10px 15px; transition: transform .15s, background .15s; }
    button:hover { transform: translateY(-1px); } #save, #refresh { background: #3569c8; color: #fff; } #save:hover, #refresh:hover { background: #2858ad; } #clear { background: #edf1f7; color: #4f5e77; }
    #message { color: #61718c; font-size: .84rem; min-height: 1.2em; margin: 0 2px 22px; }
    section { margin-top: 20px; } .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid #e9eef5; } .section-head button { font-size: .82rem; padding: 8px 12px; }
    .table-wrap { overflow-x: auto; } table { width: 100%; border-collapse: collapse; min-width: 700px; } th, td { padding: 14px 20px; border-bottom: 1px solid #edf1f6; text-align: left; vertical-align: top; }
    th { color: #8290a7; font-size: .7rem; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; white-space: nowrap; } td { color: #34425b; font-size: .86rem; } tr:last-child td { border-bottom: 0; }
    code { color: #4a5d7d; font: .78rem ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; } .name { color: #1a2d52; font-weight: 700; } .description, .timestamp { color: #7b899f; }
    .content { max-width: 260px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; } .route { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; } .arrow { color: #91a2bc; font-size: 1rem; }
    .status { display: inline-flex; align-items: center; border-radius: 999px; font-size: .72rem; font-weight: 800; letter-spacing: .02em; padding: 5px 9px; text-transform: capitalize; white-space: nowrap; } .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; background: currentColor; }
    .status-completed { background: #e5f7ee; color: #188354; } .status-queued { background: #eef2f8; color: #61718c; } .status-processing, .status-running { background: #fff4d9; color: #a56a08; } .status-failed { background: #fde9eb; color: #c14550; }
    @media (max-width: 650px) { .shell { width: min(100% - 20px, 1180px); padding-top: 26px; } .hero { display: block; } .auth { display: block; } .auth button { margin-top: 10px; margin-right: 6px; } .section-head { padding: 15px; } th, td { padding: 12px 15px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero"><div><p class="eyebrow">Operations console</p><h1>Agent Relay v2</h1><p class="muted">A clear view of connected agents and task delivery.</p></div></header>
    <div class="card auth"><div class="field"><label for="token">Agent token</label><input id="token" type="password" autocomplete="off" placeholder="agt_…"></div><button id="save">Use token</button><button id="clear">Clear</button></div>
    <p id="message" role="status"></p>
    <section class="card"><div class="section-head"><h2>Agents</h2><button id="refresh">Refresh</button></div><div id="agents" class="table-wrap"></div></section>
    <section class="card"><div class="section-head"><h2>My Tasks</h2></div><div id="tasks" class="table-wrap"></div></section>
  </main>
  <script>
    const token = document.querySelector('#token'), message = document.querySelector('#message');
    token.value = sessionStorage.getItem('relay-token') || '';
    const auth = () => token.value ? {'Authorization': `Bearer ${token.value}`} : {};
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const html = value => ({html: value});
    const cell = value => value && value.html !== undefined ? value.html : esc(value);
    async function api(path) { const r = await fetch(path, {headers: auth()}); const data = r.status === 204 ? null : await r.json(); if (!r.ok) throw new Error(data?.error?.message || 'Request failed'); return data; }
    function table(headers, rows) { return `<table><thead><tr>${headers.map(esc).map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${cell(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`; }
    function statusBadge(value) { const label = value === 'processing' ? 'running' : value; return html(`<span class="status status-${esc(value)}">${esc(label)}</span>`); }
    async function refresh() { try {
      const agents = await api('/api/v1/agents?limit=100');
      document.querySelector('#agents').innerHTML = table(['ID','Name','Description','Last seen'], agents.items.map(a=>[html(`<code>${esc(a.agent_id)}</code>`),html(`<span class="name">${esc(a.name)}</span>`),html(`<span class="description">${esc(a.description)}</span>`),html(`<span class="timestamp">${esc(a.last_seen_at)}</span>`)]));
      const [sent, received] = await Promise.all([api('/api/v1/tasks?direction=sent&limit=100'), api('/api/v1/tasks?direction=received&limit=100')]);
      const byId = new Map([...sent.items, ...received.items].map(t => [t.task_id, t])); const taskItems = [...byId.values()];
      const rows = await Promise.all(taskItems.map(async t => { const attempts = await api(`/api/v1/tasks/${encodeURIComponent(t.task_id)}/attempts`); const history = attempts.items.map(a => `${a.attempt}:${a.outcome}${a.worker_id ? ` (${a.worker_id})` : ''}`).join(', '); return [html(`<code>${esc(t.task_id)}</code>`),html(`<span class="route"><code>${esc(t.from)}</code><span class="arrow">→</span><code>${esc(t.to)}</code></span>`),statusBadge(t.status),html(`<div class="content">${esc(t.input)}</div>`),html(`<div class="content">${esc(t.output || t.error)}</div>`),html(`<span class="description">${esc(history)}</span>`)] }));
      document.querySelector('#tasks').innerHTML = table(['ID','Route','Status','Input','Output / error','Delivery history'], rows); message.textContent = `Updated ${new Date().toLocaleTimeString()}`;
    } catch (e) { message.textContent = e.message; } }
    document.querySelector('#save').onclick = () => { sessionStorage.setItem('relay-token', token.value); refresh(); };
    document.querySelector('#clear').onclick = () => { token.value = ''; sessionStorage.removeItem('relay-token'); document.querySelector('#agents').textContent = ''; document.querySelector('#tasks').textContent = ''; message.textContent = ''; };
    document.querySelector('#refresh').onclick = refresh; if (token.value) refresh();
  </script>
</body></html>
